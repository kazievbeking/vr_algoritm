<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081420">
  <meta name="description" content="Brain Hack — алгоритмдік ойлауға арналған үш тілдегі WebXR квест.">
  <title>Brain Hack · CHRONOS</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./assets/vendor/aframe-1.7.0.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <a-scene renderer="antialias: true; colorManagement: true" background="color: #070f20" fog="type: exponential; color: #070f20; density: .018" xr-mode-ui="enabled: false" webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor" loading-screen="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-entity light="type: ambient; color: #a1c6ed; intensity: 1.3"></a-entity>
    <a-entity light="type: directional; color: #68cce8; intensity: 1.8" position="1 5 3"></a-entity>
    <a-entity light="type: directional; color: #ac79e9; intensity: .8" position="-4 3 -6"></a-entity>
    <a-entity id="rig" position="0 0 4">
      <a-entity id="camera" camera="fov: 70; near: .05; far: 70" position="0 1.6 0" look-controls="pointerLockEnabled: false; touchEnabled: true" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .interactive; far: 40"></a-entity>
      <a-entity id="left-hand" laser-controls="hand: left; model: false" raycaster="objects: .interactive; far: 40; lineColor: #6af2d7"></a-entity>
      <a-entity id="right-hand" laser-controls="hand: right; model: false" raycaster="objects: .interactive; far: 40; lineColor: #b2a0ff"></a-entity>
    </a-entity>
  </a-scene>
  <div id="loading" class="loading"><span class="loader"></span><p id="loading-text" data-i18n="loading">Зертхана жүктелуде…</p></div>
  <main id="landing" hidden>
    <header class="topbar"><a class="brand" href="./" aria-label="CHRONOS"><span class="brand-mark">◈</span> CHRONOS<span class="brand-sub">EDUCATION LAB</span></a><label class="language-label"><span aria-hidden="true">◎</span><select id="language" aria-label="Тіл / Язык / Language"><option value="kk">Қазақша</option><option value="ru">Русский</option><option value="en">English</option></select></label></header>
    <div class="landing-grid">
      <section class="hero-copy">
        <div class="eyebrow"><span class="dot"></span><span data-i18n="eyebrow">ХРОНОС ЗЕРТХАНАСЫ / 2086</span></div>
        <h1 data-i18n="title">Brain Hack</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
        <p class="intro" data-i18n="intro"></p>
        <div class="actions"><button class="primary" data-command="start"><span data-i18n="start"></span><span aria-hidden="true">↗</span></button><button id="continue" hidden data-command="continue" data-i18n="continue"></button><button id="enter-vr" data-command="vr" disabled><span aria-hidden="true">◉</span> <span data-i18n="vr"></span></button></div>
        <div class="mission-meta"><span class="tiny-ring"></span><span data-i18n="duration"></span></div>
        <p id="xr-status" role="status"></p>
      </section>
      <div class="portal-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="portal-core"><div class="portal-inner"></div></div><div class="portal-base"></div><span class="coordinate c1">T + 00 : 00</span><span class="coordinate c2">CHRONOS // CORE 03</span><span class="portal-number">∞</span><div class="crosshair cross-one">+</div><div class="crosshair cross-two">+</div></div>
    </div>
    <section class="chapters" aria-label="Миссия"><article><span class="chapter-no">01</span><div><h2 data-i18n="laser"></h2><p data-i18n="sequence"></p></div><span class="chapter-symbol">↱</span></article><article><span class="chapter-no">02</span><div><h2 data-i18n="door"></h2><p data-i18n="logic"></p></div><span class="chapter-symbol">⋈</span></article><article><span class="chapter-no">03</span><div><h2 data-i18n="portal"></h2><p data-i18n="graph"></p></div><span class="chapter-symbol">◎</span></article></section>
    <footer class="landing-footer"><div><span class="footer-tag" data-i18n="desktop"></span><p data-i18n="controls"></p></div><div><span class="footer-tag">META QUEST</span><p data-i18n="vrControls"></p></div></footer>
  </main>
  <aside id="desktop-hud" hidden><span class="hud-brand">◈ CHRONOS</span><span id="hud-progress"></span><button data-command="menu" data-i18n="menu"></button></aside>
</body>
</html>
